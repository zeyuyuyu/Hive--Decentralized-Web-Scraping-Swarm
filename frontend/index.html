            <div class="bg-gray-800 p-6 rounded-lg">

                <div class="bg-green-600 p-2 rounded-full">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>

                </div>
            </div>
        </div>

        <!-- Social Share Modal -->
        <div class="fixed inset-0 bg-black bg-opacity-50 hidden" id="shareModal">
            <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-gray-800 p-6 rounded-lg w-96">
                <h3 class="text-xl font-bold mb-4">Share Your Achievement</h3>
                <p class="mb-4">I just scraped 1000+ products using Hive! Join the data revolution 🐝</p>
                <div class="flex space-x-4">
                    <button class="flex-1 bg-blue-500 py-2 rounded hover:bg-blue-600">Twitter</button>
                    <button class="flex-1 bg-green-500 py-2 rounded hover:bg-green-600">WhatsApp</button>
                    <button class="flex-1 bg-blue-600 py-2 rounded hover:bg-blue-700">LinkedIn</button>
