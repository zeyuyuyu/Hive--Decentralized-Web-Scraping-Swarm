<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hive Web Scraping Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF6B6B;
      --secondary: #4ECDC4;
      --dark: #2C3E50;
      --light: #ECF0F1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }

    body {
      background: var(--dark);
      color: var(--light);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: var(--primary);
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px var(--primary), 0 0 10px var(--primary);
      }
      to {
        text-shadow: 0 0 20px var(--primary), 0 0 30px var(--primary);
      }
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 1.5rem;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: 500;
      color: var(--secondary);
      margin: 1rem 0;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      background: var(--secondary);
      width: 0%;
      transition: width 1s ease;
    }

    .controls {
      margin-top: 3rem;
      text-align: center;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 25px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px var(--primary);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Hive Scraping Dashboard</h1>
      <p>Decentralized Web Scraping Swarm Control Center</p>
    </div>

    <div class="dashboard">
      <div class="card">
        <h3>Active Workers</h3>
        <div class="stat-value" id="workers">0</div>
        <div class="progress-bar">
          <div class="progress" id="workers-progress"></div>
        </div>
      </div>

      <div class="card">
        <h3>Pages Scraped</h3>
        <div class="stat-value" id="pages">0</div>
        <div class="progress-bar">
          <div class="progress" id="pages-progress"></div>
        </div>
      </div>

      <div class="card">
        <h3>Success Rate</h3>
        <div class="stat-value" id="success-rate">0%</div>
        <div class="progress-bar">
          <div class="progress" id="success-progress"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="start-btn">Start Swarm</button>
      <button class="btn" id="stop-btn" style="background: #E74C3C; margin-left: 1rem;">Stop Swarm</button>
    </div>
  </div>

  <script>
    // Simulated data updates
    function updateStats() {
      const workers = Math.floor(Math.random() * 100);
      const pages = Math.floor(Math.random() * 10000);
      const successRate = Math.floor(Math.random() * 100);

      document.getElementById('workers').textContent = workers;
      document.getElementById('pages').textContent = pages;
      document.getElementById('success-rate').textContent = successRate + '%';

      document.getElementById('workers-progress').style.width = workers + '%';
      document.getElementById('pages-progress').style.width = (pages/100) + '%';
      document.getElementById('success-progress').style.width = successRate + '%';
    }

    // Update stats every 2 seconds
    let updateInterval;

    document.getElementById('start-btn').addEventListener('click', () => {
      updateInterval = setInterval(updateStats, 2000);
    });

    document.getElementById('stop-btn').addEventListener('click', () => {
      clearInterval(updateInterval);
    });

    // Initial update
    updateStats();
  </script>
</body>
</html>
