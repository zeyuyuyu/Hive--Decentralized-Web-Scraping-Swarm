<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hive - Decentralized Web Scraping</title>
    <style>
        :root {
            --primary: #FF9900;
            --dark: #1a1a1a;
            --light: #f5f5f5;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: var(--dark);
            color: var(--light);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .hero {
            text-align: center;
            padding: 4rem 0;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        .hive-visualization {
            position: relative;
            height: 400px;
            background: rgba(255,153,0,0.1);
            border-radius: 10px;
            margin: 2rem 0;
            overflow: hidden;
        }

        .bee {
            position: absolute;
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            transition: all 0.5s ease;
            animation: float 3s infinite ease-in-out;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }

        .control-card {
            background: rgba(255,255,255,0.1);
            padding: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-card:hover {
            transform: translateY(-5px);
            background: rgba(255,153,0,0.2);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }

        .stat-box {
            text-align: center;
            padding: 1rem;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            flex: 1;
            margin: 0 0.5rem;
        }

        .stat-box h3 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        button {
            background: var(--primary);
            border: none;
            padding: 1rem 2rem;
            color: var(--dark);
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,153,0,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>Hive</h1>
            <p>Decentralized Web Scraping Swarm</p>
            <button onclick="startScraping()">Launch Swarm</button>
        </div>

        <div class="hive-visualization" id="hive"></div>

        <div class="controls">
            <div class="control-card" onclick="setMode('aggressive')">
                <h3>Aggressive Mode</h3>
                <p>Maximum parallel scraping</p>
            </div>
            <div class="control-card" onclick="setMode('stealth')">
                <h3>Stealth Mode</h3>
                <p>Avoid detection</p>
            </div>
            <div class="control-card" onclick="setMode('balanced')">
                <h3>Balanced Mode</h3>
                <p>Optimal performance</p>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <h3>Active Bees</h3>
                <span id="activeBees">0</span>
            </div>
            <div class="stat-box">
                <h3>Pages Scraped</h3>
                <span id="pagesScrapped">0</span>
            </div>
            <div class="stat-box">
                <h3>Success Rate</h3>
                <span id="successRate">0%</span>
            </div>
        </div>
    </div>

    <script>
        let bees = [];
        let isActive = false;
        let stats = {
            active: 0,
            pages: 0,
            success: 0
        };

        function startScraping() {
            isActive = !isActive;
            if(isActive) {
                createBees();
                updateStats();
            } else {
                clearBees();
            }
        }

        function createBees() {
            const hive = document.getElementById('hive');
            for(let i = 0; i < 20; i++) {
                const bee = document.createElement('div');
                bee.className = 'bee';
                bee.style.left = Math.random() * 100 + '%';
                bee.style.top = Math.random() * 100 + '%';
                hive.appendChild(bee);
                bees.push(bee);
                animateBee(bee);
            }
        }

        function animateBee(bee) {
            if(!isActive) return;
            bee.style.left = Math.random() * 100 + '%';
            bee.style.top = Math.random() * 100 + '%';
            setTimeout(() => animateBee(bee), Math.random() * 3000 + 1000);
        }

        function clearBees() {
            bees.forEach(bee => bee.remove());
            bees = [];
        }

        function setMode(mode) {
            document.querySelectorAll('.control-card').forEach(card => {
                card.style.border = 'none';
            });
            event.currentTarget.style.border = '2px solid var(--primary)';
        }

        function updateStats() {
            if(!isActive) return;
            stats.active = Math.floor(Math.random() * 10) + 10;
            stats.pages += Math.floor(Math.random() * 5);
            stats.success = Math.min(100, stats.success + Math.random());

            document.getElementById('activeBees').textContent = stats.active;
            document.getElementById('pagesScrapped').textContent = stats.pages;
            document.getElementById('successRate').textContent = Math.floor(stats.success) + '%';

            setTimeout(updateStats, 1000);
        }
    </script>
</body>
</html>
