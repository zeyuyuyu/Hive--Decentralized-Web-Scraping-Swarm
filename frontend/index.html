<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hive - Web Scraping Made Fun!</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="bg-gray-900 text-white">
    <nav class="bg-gray-800 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">🐝 Hive</h1>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <span class="absolute -top-2 -right-2 bg-yellow-500 rounded-full px-2 py-1 text-xs animate__animated animate__bounce animate__infinite">+25</span>
                    <img src="https://api.dicebear.com/6.x/adventurer/svg?seed=Felix" class="w-10 h-10 rounded-full border-2 border-yellow-500">
                </div>
                <div class="text-sm">
                    <p class="font-bold">Level 8 Worker Bee</p>
                    <div class="bg-gray-700 rounded-full h-2 w-32">
                        <div class="bg-yellow-500 rounded-full h-2 w-3/4 animate__animated animate__pulse animate__infinite"></div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Main Scraping Interface -->
            <div class="md:col-span-2 bg-gray-800 p-6 rounded-lg">
                <h2 class="text-xl font-bold mb-4">Start Scraping</h2>
                <div class="space-y-4">
                    <input type="url" placeholder="Enter URL to scrape..." class="w-full p-3 bg-gray-700 rounded-lg focus:ring-2 focus:ring-yellow-500 outline-none">
                    <button class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3 px-6 rounded-lg transition-all transform hover:scale-105">
                        🚀 Launch Swarm
                    </button>
                </div>
            </div>

            <!-- Achievements & Rewards Panel -->
            <div class="bg-gray-800 p-6 rounded-lg">
                <h2 class="text-xl font-bold mb-4">Your Hive Stats 🏆</h2>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span>Pages Scraped</span>
                        <span class="text-yellow-500 font-bold">1,337</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span>Hive Power</span>
                        <span class="text-yellow-500 font-bold">4.2k</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span>Global Rank</span>
                        <span class="text-yellow-500 font-bold">#42</span>
                    </div>
                </div>

                <!-- NFT Badges -->
                <div class="mt-6">
                    <h3 class="font-bold mb-3">Your Badges</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <div class="relative group">
                            <img src="https://api.dicebear.com/6.x/shapes/svg?seed=speed" class="w-full rounded-lg hover:scale-110 transition-all cursor-pointer">
                            <div class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-75 p-1 text-xs text-center rounded-b-lg opacity-0 group-hover:opacity-100 transition-opacity">Speed Demon</div>
                        </div>
                        <div class="relative group">
                            <img src="https://api.dicebear.com/6.x/shapes/svg?seed=accurate" class="w-full rounded-lg hover:scale-110 transition-all cursor-pointer">
                            <div class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-75 p-1 text-xs text-center rounded-b-lg opacity-0 group-hover:opacity-100 transition-opacity">Data Master</div>
                        </div>
                        <div class="relative group">
                            <img src="https://api.dicebear.com/6.x/shapes/svg?seed=pioneer" class="w-full rounded-lg hover:scale-110 transition-all cursor-pointer">
                            <div class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-75 p-1 text-xs text-center rounded-b-lg opacity-0 group-hover:opacity-100 transition-opacity">Early Bee</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Global Leaderboard -->
        <div class="mt-6 bg-gray-800 p-6 rounded-lg">
            <h2 class="text-xl font-bold mb-4">Global Leaderboard 🌍</h2>
            <div class="space-y-4">
                <div class="flex items-center justify-between p-3 bg-gray-700 rounded-lg animate__animated animate__fadeIn">
                    <div class="flex items-center space-x-3">
                        <span class="text-yellow-500 font-bold">#1</span>
                        <img src="https://api.dicebear.com/6.x/adventurer/svg?seed=John" class="w-8 h-8 rounded-full">
                        <span>DataKing</span>
                    </div>
                    <span class="text-yellow-500 font-bold">12.5k HP</span>
                </div>
                <!-- More leaderboard entries... -->
            </div>
        </div>
    </main>

    <!-- Achievement Popup -->
    <div class="fixed bottom-4 right-4 bg-yellow-500 text-black p-4 rounded-lg shadow-lg animate__animated animate__fadeInUp">
        <div class="flex items-center space-x-3">
            <img src="https://api.dicebear.com/6.x/shapes/svg?seed=new" class="w-12 h-12">
            <div>
                <p class="font-bold">New Achievement!</p>
                <p class="text-sm">"Speed Demon" - Scraped 100 pages in 1 minute</p>
            </div>
        </div>
    </div>
</body>
</html>
